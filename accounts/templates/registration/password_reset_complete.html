{% extends "base.html" %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/auth.css' %}">
{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card" role="main">
    <div class="auth-brand"><a href="/" class="brand">DevLink</a></div>
    <h1 class="auth-title">Password reset complete</h1>
    <p class="auth-sub">Your password has been set. You may go ahead and <a href="{% url 'accounts:login' %}">log in</a> now.</p>
  </div>
</div>
{% endblock %}
