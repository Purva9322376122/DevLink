{% extends "base.html" %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/auth.css' %}">
{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card" role="main">
    <div class="auth-brand"><a href="/" class="brand">DevLink</a></div>
    <h1 class="auth-title">Reset your password</h1>
    <p class="auth-sub">Enter your email address and we'll send a link to reset your password.</p>

    <form method="post" class="auth-form">
      {% csrf_token %}
      <div class="form-group">
        <label for="id_email" class="form-label">Email</label>
        <div class="input-wrap"><span class="input-icon">✉️</span>
          <input type="email" name="email" id="id_email" class="form-input" required placeholder="you@example.com">
        </div>
      </div>
      <button type="submit" class="btn-primary">Send reset link</button>
    </form>

  </div>
</div>
{% endblock %}
