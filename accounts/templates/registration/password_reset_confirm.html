{% extends "base.html" %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/auth.css' %}">
{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card" role="main">
    <div class="auth-brand"><a href="/" class="brand">DevLink</a></div>
    <h1 class="auth-title">Set a new password</h1>
    <p class="auth-sub">Enter a secure password for your account.</p>

    <form method="post" class="auth-form">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn-primary">Change password</button>
    </form>
  </div>
</div>
{% endblock %}
