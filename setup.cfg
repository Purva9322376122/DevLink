[coverage:run]
source = .
omit =
    */migrations/*
    */venv/*
    */tests.py
    */test_*.py
    manage.py
    Connect/Connect/wsgi.py
    Connect/Connect/asgi.py
    Connect/Connect/celery.py

[coverage:report]
show_missing = True
skip_covered = False
precision = 2
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if TYPE_CHECKING:
