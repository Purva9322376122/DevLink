<form id="message-form" class="message-input d-flex align-items-center gap-2 p-3 border-top" role="form" aria-label="Message composer">
  <button type="button" class="btn btn-light btn-sm" id="attach-btn" aria-label="Attach file"><i class="bi bi-paperclip"></i></button>
  <button type="button" class="btn btn-light btn-sm" id="emoji-btn" aria-label="Emoji picker"><i class="bi bi-emoji-smile"></i></button>
  <div class="flex-grow-1">
    <textarea id="message-text" class="form-control" rows="1" placeholder="Write a message" aria-label="Write a message"></textarea>
  </div>
  <button id="send-btn" class="btn btn-primary" aria-label="Send message"><i class="bi bi-send"></i></button>
</form>
