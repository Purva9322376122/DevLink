{% extends "base.html" %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/auth.css' %}">
{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card" role="main">
    <div class="auth-brand"><a href="/" class="brand">DevLink</a></div>
    <h1 class="auth-title">Check your email</h1>
    <p class="auth-sub">If the email provided matches an account, a password reset link has been sent.</p>
    <a href="{% url 'accounts:login' %}" class="btn-primary" style="display:inline-block;margin-top:18px;">Back to sign in</a>
  </div>
</div>
{% endblock %}
