{# Message/Conversation card for messages list #}
<div class="dl-message-card d-flex align-items-start">
  <img src="{{ convo.avatar_url }}" alt="" class="rounded-circle me-3" width="44" height="44">
  <div class="flex-grow-1">
    <div class="d-flex justify-content-between align-items-center">
      <div class="fw-600">{{ convo.title }}</div>
      <div class="text-muted small">{{ convo.last_activity|timesince }} ago</div>
    </div>
    <div class="text-muted small mt-1">{{ convo.last_message_excerpt }}</div>
  </div>
</div>
