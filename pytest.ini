[pytest]
DJANGO_SETTINGS_MODULE = Connect.settings.development
pythonpath = .
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
testpaths = .
addopts =
    -v
    --tb=short
    --strict-markers
    -p no:warnings
markers =
    slow: marks tests as slow (deselect with -m "not slow")
    integration: marks integration tests

[django]
DJANGO_SETTINGS_MODULE = Connect.settings.development
